name: WoozDesktop Temporary Build

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'woozdesktop/**'
      - '.github/workflows/woozdesktop-ci-temp.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: woozdesktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/WoozDesktop-v0.1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: WoozDesktop-v0.1
          path: woozdesktop/app/build/outputs/apk/debug/WoozDesktop-v0.1.apk
