name: Build WoozDesktop APK

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-woozdesktop-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout WoozDesktop branch
        uses: actions/checkout@v4
        with:
          ref: woozdesktop-build-20260922

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate sdkmanager
        shell: bash
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Accept Android licenses
        shell: bash
        run: yes | "$SDKMANAGER" --licenses >/dev/null || true

      - name: Install Android SDK packages
        shell: bash
        run: "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        working-directory: woozdesktop
        run: gradle assembleDebug

      - name: Rename APK
        run: cp woozdesktop/app/build/outputs/apk/debug/app-debug.apk WoozDesktop-v0.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WoozDesktop-v0.1
          path: WoozDesktop-v0.1.apk
