name: Build WoozDesktop APK v2

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-woozdesktop-apk-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout WoozDesktop source
        uses: actions/checkout@v4
        with:
          ref: woozdesktop-build-20260922

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager 2>/dev/null | head -1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            find /usr/local/lib/android/sdk -maxdepth 4 -type f -name sdkmanager || true
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: woozdesktop
        run: gradle --no-daemon assembleDebug

      - name: Prepare APK output
        shell: bash
        run: |
          test -f woozdesktop/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p release
          cp woozdesktop/app/build/outputs/apk/debug/app-debug.apk release/WoozDesktop-v0.1.apk
          sha256sum release/WoozDesktop-v0.1.apk > release/SHA256.txt

      - name: Publish APK to output branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan woozdesktop-apk-output-temp
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p release
          cp /home/runner/work/Henriz7/Henriz7/release/WoozDesktop-v0.1.apk release/WoozDesktop-v0.1.apk
          cp /home/runner/work/Henriz7/Henriz7/release/SHA256.txt release/SHA256.txt
          echo "WoozDesktop Android build" > README.md
          git add -f release/WoozDesktop-v0.1.apk release/SHA256.txt README.md
          git commit -m "Publish WoozDesktop APK"
          git push origin HEAD:woozdesktop-apk-output --force
